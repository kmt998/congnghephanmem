services:
  # ── 1. Service SQL Server 2022 ──────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sportchain-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-SportChain@2026}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: >
        /bin/bash -c "
        if [ -f /opt/mssql-tools18/bin/sqlcmd ]; then
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${DB_PASSWORD:-SportChain@2026}' -C -Q 'SELECT 1'
        else
          /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P '${DB_PASSWORD:-SportChain@2026}' -Q 'SELECT 1'
        fi"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  # ── 2. Service DB-Init: Tự động chạy init.sh khi SQL Server sẵn sàng ────────
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sportchain-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - DB_SERVER=sqlserver
      - DB_USER=sa
      - DB_PASSWORD=${DB_PASSWORD:-SportChain@2026}
      - DB_NAME=TrungTamTheThao
    volumes:
      - ./database:/database:ro
    entrypoint: ["/bin/bash", "/database/init.sh"]
    restart: "no"

volumes:
  sqlserver_data:
    name: sportchain-sqlserver-data
